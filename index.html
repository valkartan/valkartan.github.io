<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valkartan</title>
<meta name="description" content="Riksdags-, region- och kommunvalen 2010–2026 på karta och i listor, per län, kommun och valdistrikt, med SCB-statistik och jämförelser med riket.">
<style>
/* Fonts are served from the site itself (fonts/, from Fontsource; SIL Open Font License), so no visitor data goes to a font service. */
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-display: swap; font-weight: 200 800; src: url(fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-display: swap; font-weight: 400; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-display: swap; font-weight: 500; src: url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-display: swap; font-weight: 600; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-display: swap; font-weight: 400; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-display: swap; font-weight: 500; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
/* Layout: a control + detail column on the left; the main area switches between map, sortable list, and "most like Sweden" (ranking + map). Stacks on phones. */
:root {
  --bg: #f3f4f1;
  --panel: #fbfbf9;
  --ink: #17191c;
  --ink-2: #4c5157;
  --ink-3: #7b8188;
  --line: #dcded9;
  --line-strong: #b9bdb6;
  --water: #dfe6ea;
  --ballot: #f2d33b;        /* the yellow Riksdag ballot paper */
  --ballot-ink: #3d3200;
  --accent: #1f5f8b;
  --focus: #1f5f8b;
  --nodata: #fdfdfb;
  --row-sel: #fff4c2;
  --map-line: rgba(30, 34, 38, .18);
  --map-line-k: rgba(30, 34, 38, .45);
  --map-line-l: rgba(20, 22, 26, .85);
  --chip: #eceee9;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141618; --panel: #1b1e21; --ink: #eef0ee; --ink-2: #b8bdc1; --ink-3: #868c92;
    --line: #2d3236; --line-strong: #464c51; --water: #101418; --ballot: #e6c62e; --ballot-ink: #2b2300;
    --accent: #7fb6dd; --focus: #7fb6dd; --nodata: #1d2024; --row-sel: #3a3415; --map-line: rgba(0,0,0,.35);
    --map-line-k: rgba(10,12,14,.75); --map-line-l: rgba(0,0,0,.95); --chip: #262a2e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141618; --panel: #1b1e21; --ink: #eef0ee; --ink-2: #b8bdc1; --ink-3: #868c92;
  --line: #2d3236; --line-strong: #464c51; --water: #101418; --ballot: #e6c62e; --ballot-ink: #2b2300;
  --accent: #7fb6dd; --focus: #7fb6dd; --nodata: #1d2024; --row-sel: #3a3415; --map-line: rgba(0,0,0,.35);
  --map-line-k: rgba(10,12,14,.75); --map-line-l: rgba(0,0,0,.95); --chip: #262a2e; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); margin: 0; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 390px minmax(0, 1fr); height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.side-scroll { overflow-y: auto; flex: 1; min-height: 0; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

header.brand { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.brand-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand h1 { font: 700 26px/1.05 var(--font-display); letter-spacing: -.01em; margin: 0; }
.ballot { display: inline-flex; align-items: center; gap: 6px; background: var(--ballot); color: var(--ballot-ink); font: 600 11px/1 var(--font-body);
  letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px 5px 7px; border-radius: 2px; }
.ballot::before { content: ""; width: 9px; height: 11px; border: 1.5px solid currentColor; border-radius: 1px; }
.lang { margin-left: auto; display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 3px 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink-3); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.brand p { margin: 0; color: var(--ink-2); font-size: 13px; }

.controls { padding: 12px 20px 14px; display: grid; gap: 11px; border-bottom: 1px solid var(--line); }
.ctl-row:empty { display: none; }
.ctl-label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 5px; display: block; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 4px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
select { width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--panel); }
.chips { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.chip { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 3px 2px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; min-width: 0; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--chip); box-shadow: inset 0 0 0 1px var(--ink); }
.search { position: relative; }
.search input, .filter { width: 100%; padding: 7px 9px 7px 30px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--panel); }
.search svg, .filterwrap svg { position: absolute; left: 9px; top: 9px; width: 14px; height: 14px; color: var(--ink-3); }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 20; max-height: 280px; overflow-y: auto; padding: 4px; }
.suggest button { display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
.suggest button:hover, .suggest button.active { background: var(--chip); }
.suggest small { color: var(--ink-3); white-space: nowrap; }

.detail { padding: 16px 20px 24px; display: grid; gap: 18px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12.5px; color: var(--ink-3); align-items: center; }
.crumbs button, .linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.area-kind { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.area-name { font: 700 24px/1.1 var(--font-display); margin: 2px 0 0; text-wrap: balance; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.kpi { border-top: 2px solid var(--ink); padding-top: 6px; min-width: 0; }
.kpi b { display: block; font: 500 19px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11.5px; color: var(--ink-3); }
.delta { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); }
h3.sec { font: 600 11px/1.3 var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
h3.sec span { text-transform: none; letter-spacing: 0; font-weight: 400; text-align: right; }

.prow { display: grid; grid-template-columns: 34px minmax(0,1fr) 74px 52px 46px; align-items: center; gap: 6px; height: 24px; }
.prow .n { text-align: right; font: 400 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.prow.head { height: auto; font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.prow.head span { text-align: right; }
.orow span:first-child { flex: 1; }
.orow .n { font: 400 12px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prow .pk { font-weight: 600; font-size: 12.5px; }
.bar { position: relative; height: 12px; background: var(--chip); border-radius: 0 3px 3px 0; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 3px 3px 0; }
.bar .prev { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .65; }
.prow .v { text-align: right; font: 500 12.5px var(--font-mono); font-variant-numeric: tabular-nums; }
.prow .d { text-align: right; font: 400 11.5px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bloc { display: grid; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.others { margin-top: 8px; display: grid; gap: 2px; }
.orow { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding-left: 10px; border-left: 3px solid #8a63b5; }
.orow b { font-weight: 500; font-size: 12px; }
.ballot[data-et="RF"] { background: #8fc3ea; color: #0c2c45; }
.ballot[data-et="KF"] { background: #ffffff; color: #22262a; box-shadow: inset 0 0 0 1px #9aa0a6; }
#etype button i { display: inline-block; width: 9px; height: 11px; border-radius: 1px; margin-right: 6px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.blocbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.note { font-size: 12px; color: var(--ink-3); margin: 0; }
.simcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.simcard { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.simcard b { font: 500 18px/1.2 var(--font-mono); }
.simcard span { font-size: 11.5px; color: var(--ink-3); }

table.stats { width: 100%; border-collapse: collapse; font-size: 13px; }
table.stats td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
table.stats td.v { text-align: right; font: 500 12.5px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
table.stats td.r { text-align: right; font: 400 11.5px var(--font-mono); color: var(--ink-3); white-space: nowrap; padding-left: 8px; width: 64px; }
table.stats tr.on td:first-child { font-weight: 600; }
table.stats button { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: inherit; }
table.stats button:hover { text-decoration: underline; text-underline-offset: 2px; }

.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 7px; padding: 7px 11px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }

#scatter { width: 100%; height: 240px; display: block; }
.scatter-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.scatter-ctl select { font-size: 12.5px; padding: 5px 7px; }
.about { font-size: 12px; color: var(--ink-3); display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.about a { color: var(--accent); }
.about p { margin: 0; }

/* main area */
.viewbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; }
.tabs button svg { width: 15px; height: 15px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.viewbar .ctx { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.linkbtn2 { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: 12.5px; }
.linkbtn2 svg { width: 14px; height: 14px; }
.linkbox { flex: 1 1 100%; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); font: 12px var(--font-mono); }
.osmbtn { position: absolute; right: 14px; top: 122px; z-index: 5; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); padding: 6px 10px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
.osmbtn svg { width: 15px; height: 15px; }
.opbox { position: absolute; right: 14px; top: 162px; z-index: 5; display: grid; grid-template-columns: auto auto; gap: 2px 8px; align-items: center; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px 4px; font-size: 11.5px; color: var(--ink-2); }
.opbox label { font-weight: 600; }
.opbox output { font: 500 11px var(--font-mono); text-align: right; }
.opbox input { grid-column: 1 / 3; width: 130px; accent-color: var(--ink); margin: 0; }
.osmbtn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.osmattr { position: absolute; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 85%, transparent); font-size: 11px; padding: 2px 6px; border-top-left-radius: 6px; }
.osmattr a { color: var(--ink-2); }
.views { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.views.sim { grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); }
.mapwrap { position: relative; min-width: 0; min-height: 0; background: var(--water); }
#map { position: absolute; inset: 0; }
.pane { min-width: 0; min-height: 0; overflow-y: auto; background: var(--panel); }
.views.sim .pane { border-right: 1px solid var(--line); }

/* list view */
.listbar { position: sticky; top: 0; z-index: 3; background: var(--panel); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.filterwrap { position: relative; flex: 1 1 220px; max-width: 320px; }
.listbar .seg { flex: 0 1 auto; }
.listbar .count { font-size: 12.5px; color: var(--ink-3); margin-left: auto; }
.tablewrap { }
#listpane { overflow: auto; }
.listbar { left: 0; }
table.list { border-collapse: collapse; width: 100%; font-size: 13px; }
table.list th { position: sticky; top: var(--lbh, 53px); z-index: 2; background: var(--panel); text-align: right; font: 600 11.5px/1.2 var(--font-body); color: var(--ink-2); padding: 0; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
table.list th button { border: 0; background: none; width: 100%; padding: 9px 8px; text-align: inherit; cursor: pointer; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; justify-content: flex-end; }
table.list th.l, table.list td.l { text-align: left; }
table.list th.l button { justify-content: flex-start; }
table.list th[aria-sort] button { color: var(--ink); }
table.list th i.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
table.list td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.list td.l { font-family: var(--font-body); font-size: 13px; white-space: normal; min-width: 140px; }
table.list td.rk { color: var(--ink-3); width: 1%; }
table.list td.l small { display: block; color: var(--ink-3); font-size: 11.5px; }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover { background: var(--chip); }
table.list tbody tr.sel { background: var(--row-sel); }
.cellbar { position: relative; }
.cellbar::before { content: ""; position: absolute; right: 4px; top: 50%; height: 4px; transform: translateY(5px); width: var(--w); background: var(--c); border-radius: 2px; opacity: .8; }
.pos { color: var(--ink); } .negv { color: var(--ink-2); }
.more { padding: 14px; display: flex; justify-content: center; }

/* similarity view */
.simhead { padding: 16px 18px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.simhead h2 { font: 700 22px/1.1 var(--font-display); margin: 0; }
.simhead .opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.simhead label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
details.method { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--bg); font-size: 12.5px; color: var(--ink-2); }
details.method summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.method p { margin: 8px 0 0; max-width: 62ch; }
.natbar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; gap: 1px; }
.natlegend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11.5px; color: var(--ink-2); font-family: var(--font-mono); }
.natlegend i { width: 8px; height: 8px; display: inline-block; border-radius: 2px; margin-right: 4px; }
ol.rank { list-style: none; margin: 0; padding: 0; }
ol.rank li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 18px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
ol.rank li:hover { background: var(--chip); }
ol.rank li.sel { background: var(--row-sel); }
ol.rank .no { font: 500 13px var(--font-mono); color: var(--ink-3); }
ol.rank .nm b { font-weight: 600; }
ol.rank .nm small { display: block; color: var(--ink-3); font-size: 11.5px; }
ol.rank .sc { font: 500 14px var(--font-mono); text-align: right; }
ol.rank .sc small { display: block; font: 400 10.5px var(--font-body); color: var(--ink-3); }
ol.rank .why { grid-column: 2 / 4; display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); }
ol.rank .why span { background: var(--chip); border-radius: 4px; padding: 1px 6px; }
ol.rank.odd li { grid-template-columns: 34px minmax(0, 1fr) 0; }
.predrow { display: flex; gap: 10px; align-items: center; }
.predrow input { flex: 1; accent-color: var(--ink); }
.methodseg button { font-size: 12.5px; padding: 6px 2px; }
.predbody { padding: 14px 18px 24px; display: grid; gap: 16px; }
table.predtable th { text-align: right; font: 600 11px var(--font-body); color: var(--ink-3); padding: 4px 0 6px 8px; border-bottom: 1px solid var(--line-strong); }
table.predtable th:first-child { text-align: left; padding-left: 0; }
table.predtable td:first-child { font-weight: 600; }
table.predtable td.v small { display: block; font-size: 10.5px; color: var(--ink-3); }
table.predtable i.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
table.predtable td.r.bad { color: var(--ink); font-weight: 600; }
.seatbar { position: relative; display: flex; height: 16px; border-radius: 3px; overflow: hidden; gap: 1px; }
.seatbar .mid { position: absolute; left: calc(175 / 349 * 100% - 1px); top: 0; bottom: 0; width: 2px; background: var(--ink); z-index: 1; box-shadow: 0 0 0 1px var(--panel); }
.seatrow { display: grid; grid-template-columns: 54px 1fr; gap: 2px 8px; align-items: center; margin-top: 6px; }
.seatrow .sl { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.seatrow .seatbar > div { display: flex; align-items: center; justify-content: center; overflow: hidden; }
.seatrow .seatbar > div span { font: 600 10px var(--font-mono); color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.6); }
.seatrow .seatbar > div.out { opacity: .45; }
.seatrow.thin .seatbar { height: 8px; }
.seatsum { grid-column: 2; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); }
.seatsum .maj { color: var(--ink); font-weight: 600; }
.seatsum .nn { color: var(--ink-3); }
.grpdet { margin-top: 8px; font-size: 12.5px; }
.grpdet summary { cursor: pointer; color: var(--ink-2); }
.grpedit { display: grid; gap: 6px; margin-top: 6px; }
.grpedit select { font: inherit; padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--ink); }

    pr_method_title: "How the forecast works",
    pr_method_text: [
      "The starting point is the previous election. For every district that has reported, the swing is computed: the party's share now minus its share in the same district last time (or in the municipality, where the district has been redrawn).",
      "<b>Uniform</b> applies the average swing of the reported districts (weighted by votes) to every district that has not reported. <b>Local</b> uses the swing in the same municipality first, then the county, then the whole country; the fewer districts have reported in a municipality, the more it leans on the county and national figures.",
      "<b>Similar</b> (districts) lets a reported district say something about districts that resemble it, wherever they are. Each district has a list of its 40 most similar districts in the whole country, based only on what is known before election night: the previous result and turnout in the district, plus income, education, employment, foreign-born share, age and population density (the district's own figures for 2026, the municipality's for earlier years). The swing of up to 15 of the most similar that have reported is used, pulled towards the local swing when only a few have reported. <b>Combined</b> is the average of Local and Similar and is usually the safest.",
      "Votes in districts that have not reported are estimated as eligible voters (known before the election) times last election's turnout plus the change so far. On top of that come the votes counted centrally only after election night (late advance votes, votes from abroad etc., 5% of the votes in 2026): they are assumed to make up the same share as last time and split as they did then, plus the national swing.",
      "± is a rough 95% interval with two parts. First, the reported districts are resampled at random (bootstrap) and the forecast recomputed, showing how much it depends on those particular districts. Second, it allows for the reporting order not being random: the same method, order and share reported are run on the previous election, and the error there is added. With \"smallest first\" the interval is therefore wider early in the night.",
      "<b>Own</b> order: click districts on the map to mark them as reported (shift-click marks the whole municipality). Useful for seeing what a handful of districts say about the whole.",
      "Actual is the official final result, including the centrally counted votes, and the official seat distribution. So the forecast is not exactly right even when every district has reported – just like on a real election night. Forecast seats are counted as in the election law on the forecast votes per Riksdag constituency: fixed constituency seats, a national distribution and 39 adjustment seats (modified Sainte-Laguë, first divisor 1.2, or 1.4 before 2018; 4% threshold). On the final result this gives exactly the official seats in every year from 2010 to 2026. \"Closest to a seat\" lists the parties nearest to winning or losing a seat in the forecast."

  INDEX = [
    ...Object.entries(META.lan).map(([id, n]) => ({ lvl: "lan", id, n: n + " " + t("county_suffix"), sub: t("lvl_lan") })),
    ...Object.entries(META.kommun).map(([id, v]) => ({ lvl: "kommun", id, n: v[0], sub: t("lvl_kommun") })),
    ...Object.entries(SEATS?.names || {}).map(([id, n]) => ({ lvl: "vk", id, n, sub: t("lvl_vk") })),
    ...Object.entries(byId.vd).map(([id, f]) => ({ lvl: "vd", id, n: f.properties.n, sub: META.kommun[f.properties.k]?.[0] || "" })),
  ].map((o) => ({ ...o, key: o.n.toLocaleLowerCase("sv") }));
}
function initSearch() {
  const q = $("#q"), box = $("#suggest"); let active = -1, hits = [];
  const show = () => {
    const s = q.value.trim().toLocaleLowerCase("sv");
    if (s.length < 2) { box.hidden = true; return; }
    const starts = [], contains = [];
    for (const o of INDEX) { const i = o.key.indexOf(s); if (i === 0) starts.push(o); else if (i > 0) contains.push(o); if (starts.length > 40) break; }
    const rank = { lan: 0, kommun: 1, vd: 2 };
    hits = [...starts.sort((a, b) => rank[a.lvl] - rank[b.lvl]), ...contains.sort((a, b) => rank[a.lvl] - rank[b.lvl])].slice(0, 12);
    active = -1;
    box.innerHTML = hits.length ? hits.map((o, i) => `<button type="button" data-i="${i}"><span>${esc(o.n)}</span><small>${esc(o.sub)}</small></button>`).join("") : `<div class="note" style="padding:6px 8px">${esc(t("no_match"))}</div>`;
    box.hidden = false;
  };
  const go = (o) => { box.hidden = true; q.value = o.n; if (state.level !== o.lvl) setLevel(o.lvl); select(o.lvl, o.id); };
  q.addEventListener("input", show);
  q.addEventListener("keydown", (e) => {
    if (box.hidden || !hits.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; box.querySelectorAll("button").forEach((b, i) => b.classList.toggle("active", i === active)); }
    if (e.key === "Enter") { e.preventDefault(); go(hits[Math.max(0, active)]); }
    if (e.key === "Escape") box.hidden = true;
  });
  box.addEventListener("click", (e) => { const b = e.target.closest("[data-i]"); if (b) go(hits[+b.dataset.i]); });
}

// ======================================================================
// Boot
// ======================================================================
async function boot() {
  $("#loadmsg").textContent = t("loading");
  try {
    if (!window.maplibregl || !window.topojson) throw new Error(t("err_lib"));
    const [meta, stats, geo, seats] = await Promise.all([getJSON("data/meta.json"), getJSON("data/stats.json"), getJSON("data/geo_2026.json"), getJSON("data/seats.json").catch(() => null)]);
    META = meta; ST = stats; GEO26 = geo; SEATS = seats; META.parties.forEach((p, i) => PI[p.k] = i);
    applyParsed(parseHash(location.hash));
    await loadYear(2026);
    if (state.year !== 2026) await loadYear(state.year);
    if (state.simAvg) await loadAllYears();
    if (state.view === "odd") await ensureOdd();
    if (state.view === "pred") await loadPredData();
    useGeo(state.year);
    const fc = GEOY[state.year];
    if (state.sel && !byId[state.sel.lvl][state.sel.id]) state.sel = null;
    initControls(); applyLang(); applyLevel();
    $("#party-ctl").hidden = !["share", "change"].includes(state.mode);
    $("#osmbtn").setAttribute("aria-pressed", state.osm); $("#osmattr").hidden = !state.osm;
    setOpacity(state.op, false);
    setView(state.view);
    initMap(fc);
  } catch (err) { $("#loadmsg").textContent = err.message; console.error(err); }
}
window.valkartan = { state, get map() { return map; }, pred: { loadPredData, predPrepare, predict, predOrderIdx, repFromOrder, seatsFor, predUncertainty } };
boot();
})();
